# Draws my contribution graph as a snake game and publishes the SVGs to the
# `output` branch, which README.md links to.
name: Generate contribution snake

on:
  schedule:
    - cron: "43 13 * * *" # daily, shortly after the activity refresh
  workflow_dispatch:

permissions:
  contents: write # needed to push to the `output` branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # svg-only is the faster variant of Platane/snk (we don't need a GIF).
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Push dist/ to a separate `output` branch, so the generated images never
      # clutter main's history. keep_history is off by default, so the branch
      # is replaced each run instead of growing forever.
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
